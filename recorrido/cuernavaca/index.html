<!DOCTYPE html>
<html lang="es">
<head>

<title>Recorrido de racks · CUERNAVACA</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f2f4f7;color:#1d2433;font-size:15px}
header{position:sticky;top:0;z-index:5;background:#111;color:#fff;padding:8px 12px 10px;border-bottom:3px solid #FF0029}
header .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
header b{font-size:16px}
.chip{background:#ffffff22;border:0;color:#fff;border-radius:14px;padding:5px 10px;font-size:13px}
.chip.on{background:#FF0029;font-weight:bold}
.tabs{display:flex;gap:6px;margin-top:8px}
.tabs button{flex:1;border:0;border-radius:8px;padding:8px 4px;background:#ffffff22;color:#fff;font-size:14px}
.tabs button.on{background:#FF0029;font-weight:bold}
main{padding:10px;max-width:760px;margin:0 auto}
input[type=search],input[type=text],input[type=number],textarea{width:100%;font-size:16px;padding:11px;border:1px solid #c5cbd6;border-radius:10px;background:#fff}
.card{background:#fff;border-radius:12px;padding:12px;margin:10px 0;box-shadow:0 1px 3px #0001}
.muted{color:#7a8496;font-size:13px}
.big{font-size:22px;font-weight:bold;letter-spacing:.5px}
.btn{border:0;border-radius:10px;padding:12px 10px;font-size:15px;font-weight:bold;background:#e8eaf0;color:#1d2433;cursor:pointer}
.btn.pri{background:#FF0029;color:#fff}.btn.ok{background:#1e8e3e;color:#fff}.btn.dark{background:#111;color:#fff}
.btn.w{width:100%;margin-top:8px}
.pl{margin:12px 0 4px;font-weight:bold}
.pas{display:flex;flex-wrap:wrap;gap:6px}
.pas button{flex:0 0 calc(25% - 5px);border:0;border-radius:10px;background:#fff;padding:10px 4px;box-shadow:0 1px 2px #0001;font-size:14px}
.pas button b{display:block;font-size:20px}
.pas button.on{outline:3px solid #FF0029}
.mbar{height:6px;background:#e3e7ee;border-radius:3px;overflow:hidden;margin-top:5px}.mbar i{display:block;height:100%;background:#1e8e3e}
.racks{display:flex;gap:8px;overflow-x:auto;padding:8px 2px 12px}
.rack{background:#fff;border-radius:10px;padding:6px;box-shadow:0 1px 2px #0001;flex:0 0 auto}
.rack .t{font-size:12px;text-align:center;color:#4a5466;margin-bottom:4px}
.lv{width:64px;height:44px;border-radius:7px;margin-top:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;cursor:pointer;background:#dfe5ee;color:#33415c;position:relative}
.lv small{font-size:10px}
.lv.ok{background:#d7f0dd;color:#1e6b32}.lv.al{background:#ffe2b8;color:#8a4b00}
.dot{position:absolute;top:3px;right:4px;width:9px;height:9px;border-radius:50%}
.e-LLENO{background:#c62828}.e-POCO{background:#ef8a00}.e-MITAD{background:#f2c200}.e-LIBRE{background:#1e8e3e}
.ley{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:#4a5466;margin-top:6px}.ley span{display:flex;align-items:center;gap:4px}.ley i{display:inline-block;width:10px;height:10px;border-radius:50%}
.pos{display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid #eef0f4;padding:10px 0}
.pos:last-child{border-bottom:0}
.letra{flex:0 0 34px;height:34px;border-radius:8px;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:17px}
.foto{width:70px;height:70px;flex:0 0 70px;border-radius:8px;background:#eef1f5;object-fit:contain}
.cod{font-weight:bold;font-size:16px}
.desc{font-size:12px;color:#4a5466;margin-top:2px;line-height:1.3}
.seg{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.seg button{flex:1 1 30%;border:1px solid #c5cbd6;background:#fff;border-radius:9px;padding:9px 4px;font-size:14px;font-weight:bold;color:#33415c}
.seg button.s-OK{background:#1e8e3e;border-color:#1e8e3e;color:#fff}
.seg button.s-VACIA{background:#6b7280;border-color:#6b7280;color:#fff}
.seg button.s-EXT{background:#1a3f8a;border-color:#1a3f8a;color:#fff}
.ext{margin-top:6px;font-size:13px;background:#dbe8ff;border-radius:8px;padding:6px 8px}
.seg button.s-OTRO{background:#ef8a00;border-color:#ef8a00;color:#fff}
.otro{margin-top:6px;font-size:13px;background:#fff3e0;border-radius:8px;padding:6px 8px}
.esp{display:flex;gap:5px}
.esp button{flex:1;border:2px solid #c5cbd6;background:#fff;border-radius:10px;padding:10px 2px;font-size:13px;font-weight:bold}
.esp button.on.e1{background:#c62828;border-color:#c62828;color:#fff}.esp button.on.e2{background:#ef8a00;border-color:#ef8a00;color:#fff}
.esp button.on.e3{background:#f2c200;border-color:#f2c200;color:#111}.esp button.on.e4{background:#1e8e3e;border-color:#1e8e3e;color:#fff}
.esp .ic{display:block;height:22px;margin:0 auto 4px;width:44px;border:2px solid currentColor;border-radius:3px;position:relative;overflow:hidden}
.esp .ic i{position:absolute;left:0;bottom:0;width:100%;background:currentColor;opacity:.55}
.item{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #eef0f4}
.item .grow{flex:1;min-width:0}
.pill{display:inline-block;font-size:11px;padding:2px 7px;border-radius:9px;margin:3px 4px 0 0;background:#eef1f5;color:#33415c}
.pill.r{background:#ffd6d6;color:#a11}.pill.o{background:#ffe2b8;color:#8a4b00}.pill.g{background:#d7f0dd;color:#1e6b32}.pill.b{background:#dbe8ff;color:#1a3f8a}
.dest{font-weight:bold;font-size:15px;color:#1a3f8a}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal .box{background:#fff;border-radius:14px 14px 0 0;padding:14px;width:100%;max-width:760px;max-height:92vh;overflow:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chips button{border:1px solid #c5cbd6;background:#fff;border-radius:16px;padding:7px 11px;font-size:13px}
.chips button.on{background:#111;color:#fff;border-color:#111}
.res{max-height:42vh;overflow:auto}
#scanov{position:fixed;inset:0;background:#000;z-index:30;display:none;flex-direction:column}
#scanov video{flex:1;width:100%;object-fit:cover;min-height:0}
#scanov .marco{position:absolute;left:8%;right:8%;top:35%;height:22%;border:3px solid #fff;border-radius:12px;box-shadow:0 0 0 2000px #0006}
#scanov .marco.ok{border-color:#2ecc71}
#scanov .pie{background:#111;color:#fff;padding:12px;display:flex;flex-direction:column;gap:8px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#1d2433;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;display:none;z-index:40;max-width:90%;text-align:center}
.cola{background:#fff6e0;border:1px solid #f0a020;border-radius:10px;padding:8px 10px;font-size:13px;margin-top:8px;display:none}
.kpi{display:flex;gap:8px;flex-wrap:wrap}.kpi div{flex:1 1 30%;background:#fff;border-radius:10px;padding:10px;text-align:center;box-shadow:0 1px 2px #0001}.kpi b{display:block;font-size:22px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;border-bottom:1px solid #eef0f4;text-align:left}
</style>
</head>
<body>
<header>
  <div class="top"><b>Recorrido de racks · CUERNAVACA</b><span><button class="chip" id="who" onclick="pedirNombre(true)">Sin nombre</button></span></div>
  <div class="tabs"><button id="tb-r" onclick="tab('r')">Recorrido</button><button id="tb-p" onclick="tab('p')">Piso</button><button id="tb-q" onclick="tab('q')">Propuesta</button><button id="tb-a" onclick="tab('a')">Avance</button></div>
</header>
<main>
  <div class="cola" id="cola"></div>

  <section id="v-r">
    <button class="btn dark w" onclick="scanIr()">Escanear etiqueta de un nivel</button>
    <button class="btn w" onclick="verTutorial()">▶ Ver video tutorial (3 min)</button>
    <div id="pasillos"></div>
    <div id="rackwrap"></div>
    <div class="ley"><span><i style="background:#dfe5ee"></i>Sin revisar</span><span><i style="background:#9fd6ad"></i>Revisado sin problemas</span><span><i style="background:#ffc477"></i>Revisado con diferencias</span></div>
    <div class="ley"><span>Espacio:</span><span><i class="e-LLENO"></i>Lleno</span><span><i class="e-POCO"></i>Poco</span><span><i class="e-MITAD"></i>Mitad</span><span><i class="e-LIBRE"></i>Libre</span></div>
  </section>

  <section id="v-n" style="display:none"></section>

  <section id="v-p" style="display:none">
    <button class="btn pri w" onclick="nuevoPiso()">+ Anotar producto que está en el piso</button>
    <div id="piso"></div>
  </section>

  <section id="v-q" style="display:none"><div id="prop"></div></section>
  <section id="v-a" style="display:none"><div id="avance"></div></section>
</main>

<div class="modal" id="mod"><div class="box" id="modbox"></div></div>
<div id="scanov"><video id="scanvid" playsinline muted></video><div class="marco" id="marco"></div>
  <div class="pie"><div id="scanmsg">Apunta a la etiqueta de la posición (C-01-02-03-A).</div>
    <div style="display:flex;gap:8px"><input type="text" id="scanman" placeholder="o escríbela: C-01-02-03-A" autocapitalize="characters" style="flex:1"><button class="btn pri" onclick="scanManual()">OK</button></div>
    <button class="btn" onclick="cerrarScan()">Cancelar</button></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.5/dist/iife/reader/index.js"></script>
<script>
/* ===== Conexión con la hoja de Google (misma que la página de acomodo EDOMEX) ===== */
var API_URL='https://script.google.com/macros/s/AKfycbwVYGM6W6w4MQcFjniZijEm0_3WRx_ggdcvyfz93ZTL_0ngb0Sg5Z7w0gxQDWmOf1yfJw/exec';
function api(fn,args,reintentos){return new Promise(function(ok,no){var n=reintentos==null?2:reintentos;
  (function intento(){fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args||[]}),redirect:'follow'})
    .then(function(r){return r.json()}).then(function(j){if(j.ok)ok(j.r);else no(new Error(j.e||'Error de la hoja'))})
    .catch(function(e){if(n-->0)setTimeout(intento,1500);else no(new Error('SIN_RED'))})})()})}

/* ===== Datos ===== */
var PLANTAS={C:[['Planta baja',[1,2,3,4,5]],['Segundo piso',[6,7,8,9,10]]]};
var LAY={"C": {"1": {"1": 2, "2": 5, "3": 2, "4": 5, "5": 2, "6": 5, "7": 2, "8": 4, "9": 2, "10": 4, "11": 6, "12": 5, "13": 5, "14": 5, "15": 5}, "2": {"1": 2, "2": 4, "3": 4, "4": 4, "5": 4, "6": 4, "7": 4, "8": 4, "9": 3, "10": 4, "11": 3, "12": 5}, "3": {"1": 5, "2": 11, "3": 4, "4": 11, "5": 4, "6": 10, "7": 4, "8": 4, "9": 4, "10": 4, "11": 4, "12": 4}, "4": {"1": 4, "2": 4, "3": 9, "4": 4, "5": 8, "6": 4, "7": 4, "8": 4, "9": 4}, "5": {"1": 5, "2": 4, "3": 5, "4": 4, "5": 4, "6": 4, "7": 4, "8": 4}, "6": {"1": 3, "2": 2, "3": 3, "4": 2, "5": 3, "6": 2, "7": 3, "8": 2, "9": 3, "10": 2}, "7": {"1": 4, "2": 3, "3": 4, "4": 3, "5": 4, "6": 3, "7": 3, "8": 3, "9": 2, "10": 3}, "8": {"1": 3, "2": 3, "3": 3, "4": 2, "5": 3, "6": 3, "7": 3, "8": 3}, "9": {"1": 3, "2": 3, "3": 2, "4": 3, "5": 3}, "10": {"1": 3, "2": 2, "3": 3, "4": 2, "5": 3}}};
var ESP=['LLENO','POCO','MITAD','LIBRE'], ESPTXT={LLENO:'Lleno',POCO:'Poco',MITAD:'Mitad',LIBRE:'Libre'}, HUECOS={LLENO:0,POCO:1,MITAD:2,LIBRE:3};
var P=[],IDX={},MK={},REC=[],persona='',B='G',PAS=1,NIV=null,ED=null;
var LV={}, PISO={};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function toast(t,ms){var e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(function(){e.style.display='none'},ms||2400)}
function vibrar(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function parseU(u){var m=/^([GMC])-(\d+)-(\d+)-(\d+)-([A-Z]{1,2})$/.exec(String(u||'').trim());return m?{b:m[1],p:+m[2],r:+m[3],n:+m[4],pos:m[5]}:null}
function letraDe(u){return String(u).split('-')[4]||''}
function sigLetra(L){var m=L.slice().sort(function(a,b){return a.length-b.length||(a<b?-1:a>b?1:0)}).pop();if(!m)return 'A';if(m.length===1)return m==='Z'?'AA':String.fromCharCode(m.charCodeAt(0)+1);return m[1]==='Z'?String.fromCharCode(m.charCodeAt(0)+1)+'A':m[0]+String.fromCharCode(m.charCodeAt(1)+1)}
/* Orden de posiciones: A..Z y después AA, AB... */
function ordL(a,b){a=String(a||'');b=String(b||'');return a.length-b.length||(a<b?-1:a>b?1:0)}
function pad(n){return (n<10?'0':'')+n}
function nivelId(b,p,r,n){return b+'-'+pad(p)+'-'+pad(r)+'-'+pad(n)}
function nivelDe(u){var x=parseU(u);return x?nivelId(x.b,x.p,x.r,x.n):''}
function bodegaDe(r){var u=parseU(String(r[4]).trim().toUpperCase());return u?u.b:'C'}
function ubics2(r){return String(r[5]||'').split(/\s*\/\s*/).filter(Boolean)}
function plantaDe(b,p){var out=0;PLANTAS[b].forEach(function(pl,i){if(pl[1].indexOf(p)>=0)out=i});return out}
function nomPas(b,p){return 'Pasillo '+p}

/* Posiciones por nivel: principal y segundas ubicaciones */
var POS={};
function indexar(){POS={};IDX={};P.forEach(function(r){IDX[String(r[0]).toUpperCase()]=r;
  var add=function(u,seg){var n=nivelDe(u);if(!n)return;(POS[n]=POS[n]||[]).push({u:u,letra:letraDe(u),cod:String(r[0]).toUpperCase(),seg:seg})};
  add(String(r[4]).trim().toUpperCase(),false);ubics2(r).forEach(function(u){add(u.toUpperCase(),true)})});
  Object.keys(POS).forEach(function(k){POS[k].sort(function(a,b){return ordL(a.letra,b.letra)||(a.seg?1:-1)})})}

/* Estado del recorrido a partir de la hoja RECORRIDO */
function procesar(){LV={};PISO={};
  REC.forEach(function(x){var est=x[5],niv=x[2];
    if(est==='QUITAR'){LV[niv]={items:[],extras:[],fecha:x[0],persona:x[1]};return}
    if(est==='OK'||est==='VACIA'||est==='OTRO'){(LV[niv]=LV[niv]||{items:[],extras:[]}).items.push({ubic:x[3],codigo:x[4],estado:est,otro:x[6],obs:x[8]});return}
    if(est==='EXTRA'){(LV[niv]=LV[niv]||{items:[],extras:[]}).extras.push({codigo:x[6],ubic:x[3],obs:x[8]});return}
    if(est==='NIVEL'){var l=LV[niv]=LV[niv]||{items:[],extras:[]};l.espacio=x[7];l.obs=x[8];l.fecha=x[0];l.persona=x[1];return}
    if(est==='PISO'||est==='PISO_FULL'){var c=x[4];var o=PISO[c]||{};o.pasillo=x[3]||o.pasillo;o.bultos=+x[7]||1;o.fecha=x[0];o.persona=x[1];o.full=est==='PISO_FULL';o.obs=x[8];var mt=/Total (\d+) pz; cupieron (\d+)/.exec(String(x[8]||''));o.total=mt?+mt[1]:0;o.cup=mt?+mt[2]:0;o.fuente='recorrido';PISO[c]=o;return}
    if(est==='QUITAR_PISO'||est==='MOVIDO'){var c2=x[4];if(PISO[c2]||est==='MOVIDO'){PISO[c2]={quitado:true,motivo:est,destino:x[3],fecha:x[0]}}return}
  });
  // Lo marcado "No cupo" en la página de acomodo también está en el piso
  Object.keys(MK).forEach(function(c){var m=MK[c];if(m&&m.nocupo&&!PISO[c]){var r=IDX[c];var u=r?parseU(r[4]):null;PISO[c]={pasillo:u?String(u.p):'',bultos:1,fecha:m.fecha,persona:m.persona,fuente:'nocupo'}}});
}
function pisoActivo(b){return Object.keys(PISO).filter(function(c){var o=PISO[c];if(o.quitado)return false;var r=IDX[c];return r&&bodegaDe(r)===b})}

/* ===== Carga ===== */
function cargar(){var cache=store('rec_cache_cvc');
  if(cache){try{var c=JSON.parse(cache);P=c.P;MK=c.M;REC=c.R;indexar();procesar();pintar()}catch(e){}}
  Promise.all([api('getProductos'),api('getMarcas'),api('getRecorrido')]).then(function(r){P=r[0];MK=r[1]||{};REC=r[2]||[];
    store('rec_cache_cvc',JSON.stringify({P:P,M:MK,R:REC}));indexar();procesar();pintar()})
  .catch(function(e){toast(e.message==='SIN_RED'?'Sin internet: trabajando con lo guardado en el teléfono':e.message,4000)})}
function refrescarRec(){return api('getRecorrido').then(function(r){REC=r||[];guardarCache();procesar();pintar()})}
function guardarCache(){store('rec_cache_cvc',JSON.stringify({P:P,M:MK,R:REC}))}

/* ===== Cola sin internet ===== */
var COLA=[];try{COLA=JSON.parse(store('rec_cola_cvc')||'[]')}catch(e){COLA=[]}
function encolar(fn,arg,local){COLA.push({fn:fn,arg:arg,local:local});store('rec_cola_cvc',JSON.stringify(COLA));
  // se refleja de inmediato en el teléfono
  local.forEach(function(row){REC.push(row)});guardarCache();procesar();pintar();enviarCola()}
var ENVIANDO=false;
function enviarCola(){pintarCola();if(ENVIANDO||!COLA.length)return;ENVIANDO=true;var t=COLA[0];
  api(t.fn,[t.arg],1).then(function(r){COLA.shift();store('rec_cola_cvc',JSON.stringify(COLA));ENVIANDO=false;
      if(Array.isArray(r)){REC=r}else if(r&&r.rec){REC=r.rec}COLA.forEach(function(q){(q.local||[]).forEach(function(row){REC.push(row)})});guardarCache();procesar();pintar();
      if(t.fn==='moverProducto'||t.fn==='guardarNivel')api('getProductos').then(function(p){P=p;guardarCache();indexar();procesar();pintar()}).catch(function(){});
      enviarCola()})
   .catch(function(e){ENVIANDO=false;if(e.message!=='SIN_RED'){COLA.shift();store('rec_cola_cvc',JSON.stringify(COLA));toast('No se guardó: '+e.message,5000);enviarCola()}else{pintarCola();setTimeout(enviarCola,20000)}})}
function pintarCola(){var e=document.getElementById('cola');if(!COLA.length){e.style.display='none';return}
  e.style.display='block';e.innerHTML='<b>'+COLA.length+'</b> registro(s) guardados en el teléfono, se mandan solos cuando haya internet.'}
window.addEventListener('online',enviarCola);

/* ===== Navegación ===== */
function tab(t){['r','p','q','a','n'].forEach(function(x){document.getElementById('v-'+x).style.display=x===t?'block':'none';var b=document.getElementById('tb-'+x);if(b)b.className=x===t||(t==='n'&&x==='r')?'on':''});
  VISTA=t;pintar();window.scrollTo(0,0)}
var VISTA='r';
function setB(b){B=b;store('rec_b',b);var pl=PLANTAS[b][0][1];PAS=pl[0];if(VISTA==='n')tab('r');else pintar()}
function pedirNombre(forzar){if(persona&&!forzar)return true;var n=prompt('Escribe tu nombre (así queda quién revisó):',persona||'');
  if(n&&n.trim()){persona=n.trim();store('wms_persona',persona)}document.getElementById('who').textContent=persona||'Sin nombre';return !!persona}
function pintar(){if(VISTA==='r')pintarRacks();else if(VISTA==='n')pintarNivel();else if(VISTA==='p')pintarPiso();else if(VISTA==='q')pintarProp();else if(VISTA==='a')pintarAvance()}

function nivelesDe(b,p){var out=[],racks=LAY[b][p]||{};Object.keys(racks).forEach(function(r){for(var n=1;n<=racks[r];n++)out.push(nivelId(b,p,+r,n))});return out}
function estadoNivel(id){var l=LV[id];if(!l||!l.espacio)return '';var al=l.items.some(function(i){return i.estado!=='OK'})||l.extras.length;return al?'al':'ok'}
function pintarRacks(){var h='';
  PLANTAS[B].forEach(function(pl){h+='<div class="pl">'+pl[0]+'</div><div class="pas">';
    pl[1].forEach(function(p){var ns=nivelesDe(B,p),hech=ns.filter(function(n){return LV[n]&&LV[n].espacio}).length;
      h+='<button class="'+(p===PAS?'on':'')+'" onclick="PAS='+p+';pintar()"><b>'+(B==='G'&&p===11?'T':p)+'</b>'+hech+'/'+ns.length+'<div class="mbar"><i style="width:'+Math.round(100*hech/Math.max(1,ns.length))+'%"></i></div></button>'});

function pintarPiso(){var cs=pisoActivo(B),pr=propuesta(B),h='<div class="muted" style="margin-top:8px">'+cs.length+' productos en el piso de la bodega '+B+'. Incluye lo marcado "No cupo" en la página de acomodo.</div>';
  var byP={};cs.forEach(function(c){var o=PISO[c];(byP[o.pasillo||'?']=byP[o.pasillo||'?']||[]).push(c)});
  Object.keys(byP).sort(function(a,b){return (+a||99)-(+b||99)}).forEach(function(p){h+='<div class="pl">'+(p==='?'?'Sin pasillo':nomPas(B,+p))+' · '+byP[p].length+'</div><div class="card">';
    byP[p].forEach(function(c){h+=filaPiso(c,pr[c])});h+='</div>'});
  document.getElementById('piso').innerHTML=h}
function filaPiso(c,d){var r=IDX[c],o=PISO[c];
  return '<div class="item">'+fotoDe(c)+'<div class="grow"><div class="cod">'+esc(c)+'</div><div class="desc">'+descDe(c).slice(0,70)+'</div>'+
    '<span class="pill">Su lugar: '+(r?esc(r[4]):'-')+'</span>'+(o.total?'<span class="pill">'+o.total+' pz · cupieron '+o.cup+' en su lugar</span>'+(o.cup?'<span class="pill b">necesita '+Math.ceil(o.total/o.cup)+' posiciones</span>':''):(o.bultos>1?'<span class="pill">'+o.bultos+' bultos</span>':''))+(o.full?'<span class="pill g">Va a Full</span>':'')+(o.fuente==='nocupo'?'<span class="pill o">No cupo</span>':'')+
    (d&&!o.full?'<div style="margin-top:6px">Propuesta: <span class="dest">'+esc(d.destino)+'</span> <span class="muted">'+esc(d.porque)+'</span></div>':'')+
    '<div class="seg">'+(o.full?'<button onclick="marcarFull(\''+esc(c)+'\',false)">No va a Full</button>':'<button class="s-OK" onclick="mover(\''+esc(c)+'\')">Mover</button><button onclick="marcarFull(\''+esc(c)+'\',true)">Va a Full</button>')+'<button onclick="quitarPiso(\''+esc(c)+'\')">Ya no está</button></div></div></div>'}

/* ===== Propuesta: dónde acomodar lo del piso ===== */
function propuesta(b){var huecos={},letras={},out={};
  Object.keys(LV).forEach(function(id){var l=LV[id];if(id.charAt(0)!==b||!l.espacio)return;huecos[id]=HUECOS[l.espacio]||0});
  var cs=pisoActivo(b).filter(function(c){return !PISO[c].full});
  cs.sort(function(a,b2){return (+IDX[b2][6]||0)-(+IDX[a][6]||0)}); // lo que más se vende primero, más cerca de su lugar
  var pasSec={};
  cs.forEach(function(c){var r=IDX[c],u=parseU(r[4]),o=PISO[c],need=(o.total&&o.cup)?Math.min(3,Math.max(1,Math.ceil(o.total/o.cup))):(o.bultos>=3?2:1);
    var hp=u?u.p:(+o.pasillo||0),hr=u?u.r:0,hn=u?u.n:1,best=null,bs=1e9;
    Object.keys(huecos).forEach(function(id){if(huecos[id]<need)return;var x=id.split('-'),p=+x[1],rr=+x[2],n=+x[3],s;
      if(p===hp)s=Math.abs(rr-hr)+Math.abs(n-hn)*0.5;else if(plantaDe(b,p)===plantaDe(b,hp))s=100+Math.abs(p-hp)*10+rr*0.1;else s=1000+p;
      if(s<bs){bs=s;best=id}});
    if(best){huecos[best]-=need;var L={};(POS[best]||[]).forEach(function(q){L[q.letra]=1});(letras[best]||[]).forEach(function(l){L[l]=1});
      var lt=sigLetra(Object.keys(L));(letras[best]=letras[best]||[]).push(lt);
      var x=best.split('-');out[c]={destino:best+'-'+lt,nivel:best,porque:+x[1]===hp?'mismo pasillo':(plantaDe(b,+x[1])===plantaDe(b,hp)?'misma planta':'otra planta')}}
    else{var p2=hp||0;pasSec[p2]=(pasSec[p2]||0)+1;out[c]={destino:b+'-PAS-'+p2+'A',nivel:'',porque:'no hay nivel con espacio: sección del pasillo'}}});
  return out}
function pintarProp(){var pr=propuesta(B),cs=Object.keys(pr),h='';
  var hechos=Object.keys(LV).filter(function(id){return id.charAt(0)===B&&LV[id].espacio}).length,tot=0;PLANTAS[B].forEach(function(pl){pl[1].forEach(function(p){tot+=nivelesDe(B,p).length})});
  var aRack=cs.filter(function(c){return pr[c].nivel}).length;
  h+='<div class="card"><b>Dónde acomodar lo que está en el piso</b><div class="muted" style="margin-top:4px">La página busca un nivel con espacio, primero en el mismo pasillo y cerca del lugar del producto. Lo que se va a Full no se acomoda. Lo que no cabe en ningún nivel va a una sección del pasillo (PAS).</div>'+
     '<div class="kpi" style="margin-top:8px"><div><b>'+cs.length+'</b>en el piso</div><div><b>'+aRack+'</b>caben en racks</div><div><b>'+(cs.length-aRack)+'</b>a sección de pasillo</div></div>'+
     (hechos<tot?'<div class="muted" style="margin-top:8px">Van '+hechos+' de '+tot+' niveles revisados: la propuesta mejora conforme avanza el recorrido.</div>':'')+'</div>';
  var byD={};cs.forEach(function(c){var k=pr[c].nivel||pr[c].destino;(byD[k]=byD[k]||[]).push(c)});
  Object.keys(byD).sort().forEach(function(k){h+='<div class="pl">'+esc(k)+(LV[k]?' · espacio: '+ESPTXT[LV[k].espacio]:'')+'</div><div class="card">';byD[k].forEach(function(c){h+=filaPiso(c,pr[c])});h+='</div>'});
  document.getElementById('prop').innerHTML=h}

/* ===== Mover con confirmación por escaneo ===== */
var MOV=null;
function mover(c){if(!pedirNombre())return;var d=propuesta(B)[c]||{destino:''};MOV={c:c,destino:d.destino,escaneo:false};
  var h='<b>Mover '+esc(c)+'</b><div class="desc">'+descDe(c)+'</div><div class="card" style="text-align:center"><div class="muted">Llévalo a</div><div class="big" id="mdest">'+esc(d.destino||'—')+'</div></div>'+
    '<button class="btn pri w" onclick="scanDestino()">Escanear etiqueta del nivel donde lo dejé</button>'+
    '<div class="muted" style="margin-top:6px">Escanea cualquier etiqueta de ese nivel. Si lo dejaste en otro nivel, escanea la etiqueta de ese nivel y la página cambia el destino.</div>'+
    '<button class="btn w" onclick="confirmarMover(false)">Ya lo dejé ahí (sin escanear)</button><button class="btn w" onclick="cerrarMod()">Cancelar</button>';
  abrirMod(h)}
function scanDestino(){escanear(function(t){var u=parseU(t);if(!u){toast('Esa no es una etiqueta de posición: '+t,3500);return false}
  var niv=nivelDe(t);if(MOV.destino.indexOf(niv)!==0){var L={};(POS[niv]||[]).forEach(function(q){L[q.letra]=1});MOV.destino=niv+'-'+sigLetra(Object.keys(L))}
  MOV.escaneo=true;document.getElementById('mdest').textContent=MOV.destino;setTimeout(function(){confirmarMover(true)},300);return true})}
function confirmarMover(esc_){if(!MOV||!MOV.destino){toast('Falta el destino');return}var f=new Date().toISOString().replace('T',' ').slice(0,19),o=PISO[MOV.c]||{};
  encolar('moverProducto',{persona:persona,codigo:MOV.c,destino:MOV.destino,origen:o.pasillo?'piso pasillo '+o.pasillo:'piso',escaneo:!!esc_},[[f,persona,nivelDe(MOV.destino),MOV.destino,MOV.c,'MOVIDO','','','']]);
  ponerU2(MOV.c,MOV.destino);indexar();cerrarMod();vibrar(120);toast(MOV.c+' quedó en '+MOV.destino+' (segunda ubicación)',3500);MOV=null}

/* ===== Avance ===== */
function pintarAvance(){var h='',tot=0,hech=0,ok=0,vac=0,otr=0,ext=0;var filas='';
  PLANTAS[B].forEach(function(pl){pl[1].forEach(function(p){var ns=nivelesDe(B,p),hh=0,v=0,o=0,e=0,es={LLENO:0,POCO:0,MITAD:0,LIBRE:0};
    ns.forEach(function(id){var l=LV[id];if(!l||!l.espacio)return;hh++;es[l.espacio]++;l.items.forEach(function(i){if(i.estado==='OK')ok++;else if(i.estado==='VACIA'){v++;vac++}else{o++;otr++}});e+=l.extras.length;ext+=l.extras.length});
    tot+=ns.length;hech+=hh;filas+='<tr><td>'+nomPas(B,p)+'</td><td>'+hh+'/'+ns.length+'</td><td>'+v+'</td><td>'+o+'</td><td>'+e+'</td><td>'+es.LIBRE+'/'+es.MITAD+'/'+es.POCO+'</td></tr>'})});
  h+='<div class="kpi" style="margin-top:8px"><div><b>'+hech+'/'+tot+'</b>niveles</div><div><b>'+ok+'</b>en su lugar</div><div><b>'+vac+'</b>vacías</div><div><b>'+otr+'</b>con otro producto</div><div><b>'+ext+'</b>extras</div><div><b>'+pisoActivo(B).length+'</b>en el piso</div></div>';
  h+='<div class="card"><table><tr><th>Pasillo</th><th>Niveles</th><th>Vacías</th><th>Otro</th><th>Extras</th><th>Libre/Mitad/Poco</th></tr>'+filas+'</table></div>';
  var vacias=[];Object.keys(LV).forEach(function(id){if(id.charAt(0)!==B)return;LV[id].items.forEach(function(i){if(i.estado==='VACIA')vacias.push(i)})});
  if(vacias.length){h+='<div class="card"><b>Posiciones vacías</b><div class="muted">El producto no estaba en su lugar: puede estar en el piso, en otro nivel o ya no hay.</div>';
    vacias.slice(0,200).forEach(function(i){h+='<div class="item">'+fotoDe(i.codigo)+'<div class="grow"><div class="cod">'+esc(i.codigo)+'</div><div class="desc">'+descDe(i.codigo).slice(0,70)+'</div><span class="pill">'+esc(i.ubic)+'</span></div></div>'});h+='</div>'}
  document.getElementById('avance').innerHTML=h}

/* ===== Escáner (etiquetas de posición y de producto) ===== */
var SC={st:null,cb:null,t:0,bd:null,cv:null};
function scanIr(){if(!pedirNombre())return;escanear(function(t){var u=parseU(t);if(!u){toast('Esa no es una etiqueta de posición: '+t,3500);return false}
  B=u.b;PAS=u.p;setB(u.b);PAS=u.p;abrirNivel(nivelDe(t));return true})}
function scanProducto(){var cb=PICK;escanear(function(t){var u=String(t).toUpperCase().trim();var c=IDX[u]?u:(u.split(/\s+/).filter(function(k){return IDX[k]})[0]||'');
  if(!c){document.getElementById('pq').value=u;buscarPick(u);return true}PICK=cb;pick(c);return true})}
function escanear(cb){SC.cb=cb;document.getElementById('scanov').style.display='flex';document.getElementById('scanman').value='';document.getElementById('marco').className='marco';
  document.getElementById('scanmsg').textContent='Apunta a la etiqueta. Si no la lee, escríbela abajo.';
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){document.getElementById('scanmsg').textContent='Este teléfono no deja usar la cámara aquí: escribe la etiqueta.';return}
  navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}},audio:false}).then(function(st){SC.st=st;var v=document.getElementById('scanvid');v.srcObject=st;v.play();
    if('BarcodeDetector' in window){try{SC.bd=new BarcodeDetector()}catch(e){SC.bd=null}}loop()}).catch(function(){document.getElementById('scanmsg').textContent='No se pudo abrir la cámara: escribe la etiqueta.'})}
function loop(){if(!SC.st)return;var v=document.getElementById('scanvid');if(!v.videoWidth){SC.t=setTimeout(loop,200);return}
  var c=SC.cv||(SC.cv=document.createElement('canvas')),w=Math.min(1280,v.videoWidth),h=Math.round(v.videoHeight*w/v.videoWidth);c.width=w;c.height=h;var g=c.getContext('2d',{willReadFrequently:true});g.drawImage(v,0,0,w,h);
  var p=SC.bd?SC.bd.detect(c).then(function(r){return r.map(function(x){return x.rawValue})}):(window.ZXingWASM?ZXingWASM.readBarcodes(g.getImageData(0,0,w,h),{tryHarder:true,maxNumberOfSymbols:3}).then(function(r){return r.map(function(x){return x.text})}):Promise.resolve([]));
  p.then(function(res){res=res.filter(Boolean);if(res.length&&leido(res[0]))return;SC.t=setTimeout(loop,150)}).catch(function(){SC.t=setTimeout(loop,300)})}
function limpiarLectura(t){t=String(t||'').toUpperCase().trim();var m=/[GMC]-\d{2}-\d{2}-\d{2}-[A-Z]{1,2}/.exec(t);return m?m[0]:t}
function leido(t){t=limpiarLectura(t);vibrar(60);document.getElementById('marco').className='marco ok';var cb=SC.cb;var acepta=cb?cb(t):true;if(acepta!==false){cerrarScan();return true}
  document.getElementById('marco').className='marco';return false}
function scanManual(){var t=document.getElementById('scanman').value;if(t.trim())leido(t)}
function cerrarScan(){clearTimeout(SC.t);if(SC.st)SC.st.getTracks().forEach(function(t){try{t.stop()}catch(e){}});SC.st=null;document.getElementById('scanov').style.display='none'}

function verTutorial(){abrirMod('<b>Cómo usar el recorrido de racks</b><video src="../edomex/tutorial.mp4" controls playsinline autoplay style="width:100%;max-height:75vh;margin-top:8px;border-radius:10px;background:#000"></video><button class="btn w" onclick="var v=document.querySelector(\'#modbox video\');v&&v.pause();cerrarMod()">Cerrar</button>')}
/* ===== Inicio ===== */
persona=store('wms_persona')||'';document.getElementById('who').textContent=persona||'Sin nombre';
setB('C');tab('r');cargar();enviarCola();
</script>
