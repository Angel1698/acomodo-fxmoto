<script>
/* ===== Conexión con la hoja de Google ===== */
var API_URL='https://script.google.com/macros/s/AKfycbxeDpp1-f-eKKXiLevSk-YbC6PMvkKqLJyqbcgH5w_lWgUurR8PvSQ_0uTFWkVteL56/exec';
function api(fn,args,reintentos){return new Promise(function(ok,no){var n=reintentos==null?2:reintentos;
  (function intento(){fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args||[]}),redirect:'follow'})
    .then(function(r){return r.json()}).then(function(j){if(j.ok)ok(j.r);else no(new Error(j.e||'Error de la hoja'))})
    .catch(function(e){if(n-->0)setTimeout(intento,1500);else no(new Error('SIN_RED'))})})()})}

/* ===== Datos ===== */
var PLANTAS={G:[['Planta baja',[1,2,3,4]],['Planta alta',[5,6,7,8,9,10]],['Tapanco',[11]]],M:[['Planta baja',[1,2,3,4]],['Planta alta',[5,6,7,8]],['Tapanco',[9,10]]]};
var LAY={"G":{"1":{"1":3,"2":3,"3":3,"4":3,"5":3,"6":3,"7":3,"8":3},"2":{"1":3,"2":3,"3":3,"4":3,"5":3,"6":3,"7":3,"8":3},"3":{"1":3,"2":3,"3":3,"4":3},"4":{"1":2,"2":2},"5":{"1":3,"2":3,"3":3,"4":3,"5":3,"6":3,"7":3,"8":3},"6":{"1":3,"2":3,"3":3,"4":3,"5":3,"6":3,"7":3,"8":3},"7":{"1":3,"2":3,"3":3,"4":3,"5":3,"6":3,"7":3,"8":3},"8":{"1":4,"2":4,"3":4,"4":4,"5":4,"6":4,"7":4,"8":4},"9":{"1":4,"2":3,"3":4,"4":3,"5":4,"6":3,"7":4,"8":3},"10":{"1":2,"2":3},"11":{"1":1,"2":1,"3":1,"4":1,"5":1,"6":1,"7":1,"8":1,"9":1,"10":1,"11":1,"12":1,"13":1,"14":1,"15":1,"16":1,"17":1,"18":1,"19":1,"20":1,"21":1}},"M":{"1":{"1":3,"2":3,"3":3,"4":3,"5":3,"6":3,"7":3,"8":3,"9":3},"2":{"1":4,"2":3,"3":4,"4":3,"5":4,"6":3,"7":4,"8":3},"3":{"1":4,"2":4,"3":4,"4":4,"5":4,"6":4,"7":4,"8":4},"4":{"1":4,"2":4,"3":4,"4":4,"5":4},"5":{"1":3,"2":6,"3":3,"4":6,"5":3,"6":6,"7":3,"8":6,"9":3},"6":{"1":3,"2":4,"3":3,"4":4,"5":3,"6":4,"7":3,"8":4},"7":{"1":2,"2":2,"3":2,"4":2,"5":2,"6":2,"7":2,"8":2},"8":{"1":3,"2":3,"3":3,"4":3,"5":3},"9":{"1":2,"2":3,"3":2,"4":3,"5":2,"6":3,"7":2,"8":3},"10":{"1":3,"2":2,"3":3,"4":2,"5":3,"6":2,"7":3,"8":2}}};
var CK='rec_edo';
var ESP=['LLENO','POCO','MITAD','LIBRE'], ESPTXT={LLENO:'No cabe nada',POCO:'1 caja',MITAD:'2 cajas',LIBRE:'3 o más'}, HUECOS={LLENO:0,POCO:1,MITAD:2,LIBRE:3};
var P=[],IDX={},MK={},REC=[],persona='',B='G',PAS=1,NIV=null,ED=null,EST=null,LEGACY=false;
var LV={}, PISO={}, APART={};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function jsq(s){return esc(String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"))}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null){localStorage.removeItem(k);return}localStorage.setItem(k,v)}catch(e){return null}}
function toast(t,ms){var e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(function(){e.style.display='none'},ms||2400)}
function vibrar(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function ahora(){var d=new Date(),z=function(n){return (n<10?'0':'')+n};return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+' '+z(d.getHours())+':'+z(d.getMinutes())+':'+z(d.getSeconds())}
function minDesde(f){return (Date.now()-new Date(String(f).replace(' ','T')).getTime())/60000}
function parseU(u){var m=/^([GM])-(\d+)-(\d+)-(\d+)-([A-Z]{1,2})$/.exec(String(u||'').trim());return m?{b:m[1],p:+m[2],r:+m[3],n:+m[4],pos:m[5]}:null}
function letraDe(u){return String(u).split('-')[4]||''}
function ordL(a,b){a=String(a||'');b=String(b||'');return a.length-b.length||(a<b?-1:a>b?1:0)}
function sigLetra(L){var m=L.slice().sort(ordL).pop();if(!m)return 'A';if(m.length===1)return m==='Z'?'AA':String.fromCharCode(m.charCodeAt(0)+1);return m[1]==='Z'?String.fromCharCode(m.charCodeAt(0)+1)+'A':m[0]+String.fromCharCode(m.charCodeAt(1)+1)}
function pad(n){return (n<10?'0':'')+n}
function nivelId(b,p,r,n){return b+'-'+pad(p)+'-'+pad(r)+'-'+pad(n)}
function nivelDe(u){var x=parseU(u);return x?nivelId(x.b,x.p,x.r,x.n):''}
function bodegaDe(r){var u=parseU(String(r[4]).trim().toUpperCase());return u?u.b:'G'}
function pasDe(c){var r=IDX[c];var u=r?parseU(String(r[4]).toUpperCase()):null;return u?u.p+(u.b===B?0:100):0}
function otraB(b){return b==='G'?'M':'G'}
function pk(p){p=+p;return p>100?otraB(B)+(p-100):B+p}
function rackTxt(b,p){return b==='G'&&+p===11?'Carril ':'Rack '}
function ubics2(r){return String(r[5]||'').split(/\s*\/\s*/).filter(Boolean)}
function plantaDe(b,p){var out=0;PLANTAS[b].forEach(function(pl,i){if(pl[1].indexOf(p)>=0)out=i});return out}
function nomPas(b,p){p=+p;if(p>100){b=otraB(b);p-=100;return (b==='G'&&p===11?'Tapanco':'Pasillo '+p)+' de la bodega '+b}return b==='G'&&p===11?'Tapanco':'Pasillo '+p}
function pasEst(p){return EST&&EST.pasillos&&EST.pasillos[pk(p)]||{estado:'ABIERTO',racks:{}}}
function cerrado(p){return pasEst(p).estado==='CERRADO'}
function duenoRack(p,r){var rk=pasEst(p).racks||{},q='';Object.keys(rk).forEach(function(n){if((rk[n]||[]).map(Number).indexOf(+r)>=0)q=n});return q}
function misRacks(p){var rk=pasEst(p).racks||{};return (rk[persona]||[]).map(Number)}

/* Posiciones por nivel: principal y segundas ubicaciones (orden A..Z, luego AA, AB...) */
var POS={};
function indexar(){POS={};IDX={};P.forEach(function(r){IDX[String(r[0]).toUpperCase()]=r;
  var add=function(u,seg){var n=nivelDe(u);if(!n)return;(POS[n]=POS[n]||[]).push({u:u,letra:letraDe(u),cod:String(r[0]).toUpperCase(),seg:seg})};
  add(String(r[4]).trim().toUpperCase(),false);ubics2(r).forEach(function(u){add(u.toUpperCase(),true)})});
  Object.keys(POS).forEach(function(k){POS[k].sort(function(a,b){return ordL(a.letra,b.letra)||(a.seg?1:-1)})})}

/* Estado del recorrido a partir de la hoja RECORRIDO */
var SINESC=[];
function procesar(){LV={};PISO={};APART={};SINESC=[];
  REC.forEach(function(x){var est=x[5],niv=x[2];
    if(est==='SINESCANEO'){SINESC.push(x);return}
    if(est==='APARTADO'){APART[niv]={persona:x[1],fecha:x[0]};return}
    if(est==='QUITAR'){LV[niv]={items:[],extras:[],fecha:x[0],persona:x[1]};return}
    if(est==='OK'||est==='VACIA'||est==='OTRO'){(LV[niv]=LV[niv]||{items:[],extras:[]}).items.push({ubic:x[3],codigo:x[4],estado:est,otro:x[6],obs:x[8],auto:x[7]==='EXT'});return}
    if(est==='EXTRA'){(LV[niv]=LV[niv]||{items:[],extras:[]}).extras.push({codigo:x[6],ubic:x[3],obs:x[8],auto:x[7]==='EXT'});return}
    if(est==='NIVEL'){var l=LV[niv]=LV[niv]||{items:[],extras:[]};l.espacio=x[7];l.obs=x[8];l.fecha=x[0];l.persona=x[1];if(APART[niv]&&APART[niv].fecha<=x[0])delete APART[niv];return}
    if(est==='PISO'||est==='PISO_FULL'){var c=x[4];var o=PISO[c]||{};o.pasillo=x[3]||o.pasillo;o.bultos=+x[7]||1;o.fecha=x[0];o.persona=x[1];o.full=est==='PISO_FULL';o.obs=x[8];
      var mt=/Total (\d+) pz; cupieron (\d+)/.exec(String(x[8]||''));o.total=mt?+mt[1]:0;o.cup=mt?+mt[2]:0;o.fuente='recorrido';o.quitado=false;PISO[c]=o;return}
    if(est==='QUITAR_PISO'||est==='MOVIDO'){var c2=x[4];if(PISO[c2]||est==='MOVIDO'){PISO[c2]={quitado:true,motivo:est,destino:x[3],fecha:x[0]}}return}
  });

function revisionPasillo(p){var ns=nivelesDe(B,p),sin=ns.filter(function(n){return !(LV[n]&&LV[n].espacio)}),ap=Object.keys(APART).filter(function(n){return +n.split('-')[1]===p&&!(LV[n]&&LV[n].espacio&&LV[n].fecha>=APART[n].fecha)});

  var vac=[];ns.forEach(function(n){var l=LV[n];if(!l)return;l.items.forEach(function(i){var m=MK[String(i.codigo).toUpperCase()]||{};if(i.estado==='VACIA'&&m.estado==='ACOMODADO'&&!halla[i.codigo]&&!(PISO[i.codigo]&&!PISO[i.codigo].quitado))vac.push(i)})});

  document.getElementById('movs').innerHTML=h}
function scanMov(id){if(!pedirNombre())return;var a=ASG().filter(function(x){return x[0]===id})[0],dest=String(a[4]).split(',');
  escanearEstricto('Escanea la etiqueta de la posición donde lo dejaste',function(t){var pu=String(t).toUpperCase();
    if(dest.indexOf(pu)<0){equivocada('escaneaste '+pu+' y va en '+dest.join(', '));return false}
    confirmarMov(id,pu,false);return true},function(){confirmarMov(id,'',true)})}
function confirmarMov(id,pos,sinEsc){if(!pedirNombre())return;
  api('confirmarMovimiento',[{persona:persona,id:id,posEscaneada:pos||'',sinEscaneo:!!sinEsc}],1).then(function(r){EST=r;guardarCache();vibrar(120);toast(sinEsc?'Registrado SIN ESCANEAR: el encargado lo revisa':'Listo: quedó en su nuevo lugar',3500);
    Promise.all([api('getProductos'),api('getRecorrido')]).then(function(x){P=x[0];REC=x[1];guardarCache();indexar();procesar();pintar()}).catch(function(){pintar()})})
  .catch(function(e){toast(e.message==='SIN_RED'?'Sin internet: vuelve a intentarlo en un momento':e.message,5000)})}
function noCupoUI(id){if(!pedirNombre())return;var a=ASG().filter(function(x){return x[0]===id})[0];
  abrirMod('<b>No cupo: '+esc(a[3])+'</b><div class="muted" style="margin:6px 0">¿Cuántas piezas sí cupieron en '+esc(String(a[4]).replace(/,/g,', '))+'? Con eso la hoja calcula el tamaño real y busca un lugar más grande en el mismo pasillo. Pon 0 si no cupo ninguna.</div><input type="number" id="ncup" min="0" inputmode="numeric">'+
    '<button class="btn pri w" onclick="noCupoEnviar(\''+jsq(id)+'\')">Buscar otro lugar</button><button class="btn w" onclick="cerrarMod()">Cancelar</button>')}
function noCupoEnviar(id){var v=document.getElementById('ncup').value;if(v===''){toast('Escribe cuántas cupieron (0 si ninguna)');return}cerrarMod();
  api('noCupo',[{persona:persona,id:id,cupieron:Math.floor(+v||0)}],1).then(function(r){EST=r;guardarCache();toast('Nuevo lugar asignado',3000);pintar()}).catch(function(e){toast(e.message==='SIN_RED'?'Necesitas internet':e.message,4000)})}

/* ===== Mover (solo si la hoja aún no tiene las funciones nuevas) ===== */
function moverLegacy(c){if(!pedirNombre())return;escanear(function(t){var u=parseU(t);if(!u){toast('Esa no es una etiqueta de posición',3000);return false}
  var niv=nivelDe(t),Ls=(POS[niv]||[]).map(function(q){return q.letra}),dst=niv+'-'+sigLetra(Ls);
  encolar('moverProducto',{persona:persona,codigo:c,destino:dst,origen:'piso',escaneo:true},[[ahora(),persona,niv,dst,c,'MOVIDO','','','']]);ponerU2(c,dst);indexar();toast(c+' quedó en '+dst,3500);return true})}

/* ===== Avance ===== */
function pintarAvance(){var h='',tot=0,hech=0,ok=0,vac=0,otr=0,ext=0,filas='',per={};
  Object.keys(LV).forEach(function(id){var l=LV[id];if(id.charAt(0)===B&&l.espacio&&l.persona)per[l.persona]=(per[l.persona]||0)+1});
  PLANTAS[B].forEach(function(pl){pl[1].forEach(function(p){var ns=nivelesDe(B,p),hh=0,v=0,o=0,e=0;
    ns.forEach(function(id){var l=LV[id];if(!l||!l.espacio)return;hh++;l.items.forEach(function(i){if(i.estado==='OK')ok++;else if(i.estado==='VACIA'){v++;vac++}else{o++;otr++}});e+=l.extras.length;ext+=l.extras.length});
    tot+=ns.length;hech+=hh;filas+='<tr><td>'+nomPas(B,p)+(cerrado(p)?' ✓':'')+'</td><td>'+hh+'/'+ns.length+'</td><td>'+v+'</td><td>'+o+'</td><td>'+e+'</td></tr>'})});
  h+='<div class="kpi" style="margin-top:8px"><div><b>'+hech+'/'+tot+'</b>niveles</div><div><b>'+ok+'</b>en su lugar</div><div><b>'+vac+'</b>vacías</div><div><b>'+otr+'</b>con otro</div><div><b>'+ext+'</b>extras</div><div><b>'+pisoActivo(B).length+'</b>en el piso</div></div>';
  h+='<div class="card"><table><tr><th>Pasillo</th><th>Niveles</th><th>Vacías</th><th>Otro</th><th>Extras</th></tr>'+filas+'</table></div>';
  h+='<div class="card"><b>Niveles revisados por persona</b>'+Object.keys(per).sort(function(a,b){return per[b]-per[a]}).map(function(n){return '<div class="chk"><span>'+esc(n)+'</span><b>'+per[n]+'</b></div>'}).join('')+'</div>';
  var se=SINESC.filter(function(x){return String(x[2]||x[3]).charAt(0)===B});
  h+='<div class="card"><b>Sin escanear (etiqueta dañada): '+se.length+'</b><div class="muted">Revisa que esté bien acomodado y cambia la etiqueta.</div>'+se.slice().reverse().slice(0,60).map(function(x){return '<div class="chk"><span>'+esc(x[3]||x[2])+(x[4]?' · '+esc(x[4]):'')+'<br><small>'+esc(x[1])+' · '+esc(x[0])+' · '+esc(x[8])+'</small></span></div>'}).join('')+'</div>';
  document.getElementById('avance').innerHTML=h}

/* ===== Escáner ===== */
var SC={st:null,cb:null,t:0,bd:null,cv:null};
function scanIr(){if(!pedirNombre(scanIr))return;escanear(function(t){var u=parseU(t);if(!u){toast('Esa no es una etiqueta de posición: '+t,3500);return false}
  if(u.b!==B)setB(u.b);PAS=u.p;abrirNivel(nivelDe(t));return true})}
function scanProducto(){var cb=PICK;escanear(function(t){var u=String(t).toUpperCase().trim();var c=IDX[u]?u:(u.split(/\s+/).filter(function(k){return IDX[k]})[0]||'');
  if(!c){document.getElementById('pq').value=u;buscarPick(u);PICK_ESC=true;return true}PICK=cb;PICK_ESC=true;pick(c);return true})}
function escanear(cb,opt){SC.cb=cb;SC.opt=opt||{};document.getElementById('scanov').style.display='flex';document.getElementById('scanman').value='';document.getElementById('marco').className='marco';
  document.getElementById('scanmanrow').style.display=SC.opt.titulo?'none':'flex';document.getElementById('scandan').style.display=SC.opt.danada?'block':'none';
  document.getElementById('scanmsg').textContent=SC.opt.titulo?SC.opt.titulo+'. No se puede escribir a mano.':'Apunta a la etiqueta. Si no la lee, escríbela abajo.';
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){document.getElementById('scanmsg').textContent=SC.opt.titulo?'Este teléfono no deja usar la cámara. Si la etiqueta está dañada usa el botón de abajo.':'Este teléfono no deja usar la cámara aquí: escribe la etiqueta.';return}
  navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}},audio:false}).then(function(st){SC.st=st;var v=document.getElementById('scanvid');v.srcObject=st;v.play();
    if('BarcodeDetector' in window){try{SC.bd=new BarcodeDetector()}catch(e){SC.bd=null}}loop()}).catch(function(){document.getElementById('scanmsg').textContent=SC.opt.titulo?'No se pudo abrir la cámara: revisa el permiso de cámara del navegador.':'No se pudo abrir la cámara: escribe la etiqueta.'})}
function loop(){if(!SC.st)return;var v=document.getElementById('scanvid');if(!v.videoWidth){SC.t=setTimeout(loop,200);return}
  var c=SC.cv||(SC.cv=document.createElement('canvas')),w=Math.min(1280,v.videoWidth),h=Math.round(v.videoHeight*w/v.videoWidth);c.width=w;c.height=h;var g=c.getContext('2d',{willReadFrequently:true});g.drawImage(v,0,0,w,h);
  var p=SC.bd?SC.bd.detect(c).then(function(r){return r.map(function(x){return x.rawValue})}):(window.ZXingWASM?ZXingWASM.readBarcodes(g.getImageData(0,0,w,h),{tryHarder:true,maxNumberOfSymbols:3}).then(function(r){return r.map(function(x){return x.text})}):Promise.resolve([]));
  p.then(function(res){res=res.filter(Boolean);if(res.length&&leido(res[0]))return;SC.t=setTimeout(loop,150)}).catch(function(){SC.t=setTimeout(loop,300)})}
function limpiarLectura(t){t=String(t||'').toUpperCase().trim();var m=/(C)-\d{2}-\d{2}-\d{2}-[A-Z]{1,2}/.exec(t);return m?m[0]:t}
function leido(t){t=limpiarLectura(t);vibrar(60);document.getElementById('marco').className='marco ok';var cb=SC.cb;var acepta=cb?cb(t):true;if(acepta!==false){cerrarScan();return true}
  document.getElementById('marco').className='marco';return false}
function scanDanada(){var f=SC.opt&&SC.opt.danada;if(!f)return;if(!confirm('¿La etiqueta está dañada o no se puede leer?\nSe registra SIN ESCANEAR y el encargado lo revisa.'))return;cerrarScan();f()}
function scanManual(){var t=document.getElementById('scanman').value;if(t.trim())leido(t)}
function cerrarScan(){clearTimeout(SC.t);if(SC.st)SC.st.getTracks().forEach(function(t){try{t.stop()}catch(e){}});SC.st=null;document.getElementById('scanov').style.display='none'}

/* ===== Inicio ===== */
persona=store('wms_persona')||'';pintarWho();
setB(store('rec_b')||'G');tab('r');cargar();enviarCola();
